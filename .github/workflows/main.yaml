name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    environment: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      ENV: dev
      VERSION: "2"
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Semantic Release PR Title Check
      uses: osl-incubator/semantic-release-pr-title-check@v1.4.2
      with:
        convention-name: conventionalcommits 

    - uses: actions/checkout@v4

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        environment-file: conda/base.yaml
        channels: conda-forge,nodefaults
        activate-environment: mosqlimate
        auto-update-conda: true
        conda-solver: libmamba

    - name: Install dependencies
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root

    - name: Clean Conda Cache
      run: |
        conda clean --all --yes

    - name: Install frontend deps
      run: |
        cd frontend
        npm install

    - name: Frontend tests (Vitest + coverage)
      run: |
        cd frontend
        npm run test:coverage

    - name: Lint
      run: make lint

    - name: Vulture (dead code check)
      run: make vulture

    - name: Setup containers
      id: setup
      run: |
        python contrib/scripts/do_dotenv.py
        python contrib/scripts/do_psqlconf.py
        docker network create infodengue-dev_infodengue

    - name: Start containers
      id: start
      continue-on-error: true
      run: |
        make up 2>&1 | tee /tmp/container-start.log

    - name: Collect errors
      if: steps.start.outcome != 'success'
      run: |
        echo "::group::Container Start Errors (only relevant lines)"
        echo ""
        echo "--- Failed / Unhealthy Services ---"
        docker compose -f docker-compose.dev.yaml ps -a 2>/dev/null | grep -E "Exit|unhealthy|starting" || echo "(no containers running)"
        echo ""
        echo "--- Error Lines ---"
        grep -iE 'error[^a-z]|fatal|traceback|exception|denied|failed to|cannot|could not|invalid' /tmp/container-start.log | head -40
        echo ""
        echo "::endgroup::"
        exit 1

    - name: Migration check
      run: |
        make migration-check

    - name: Install coverage
      run: |
        make coverage-install

    - name: Test with coverage
      run: |
        set -o pipefail
        make test-cov 2>&1 | tee /tmp/coverage.log

    - name: Verify tests actually ran
      if: always()
      run: |
        echo "::group::Coverage report"
        grep -E "Name|TOTAL|registry" /tmp/coverage.log | tail -30 || true
        echo "::endgroup::"
        if ! grep -qE "Ran [0-9]+ tests" /tmp/coverage.log; then
          echo "::error::The backend test run produced no test results (Ran N tests missing)."
          echo "This usually means the backend container is missing required env vars"
          echo "(e.g. SECRET_KEY, FRONTEND_PORT, BACKEND_PORT) so Django cannot load settings"
          echo "and manage.py exits immediately. Check the 'Test with coverage' step log."
          exit 1
        fi
        if ! grep -q "TOTAL" /tmp/coverage.log; then
          echo "::error::Coverage report is empty; nothing was measured."
          exit 1
        fi

    - name: Post coverage summary to PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let table = null;
          try {
            const log = fs.readFileSync('/tmp/coverage.log', 'utf8');
            const lines = log.split('\n');
            const start = lines.findIndex(
              (l) => l.includes('Stmts') && l.includes('Cover')
            );
            const totalIdx = lines.findIndex(
              (l, i) => i > start && l.includes('TOTAL')
            );
            if (start !== -1) {
              table = lines
                .slice(start, totalIdx === -1 ? undefined : totalIdx + 1)
                .join('\n')
                .trim();
            }
          } catch (e) {
            console.log('Could not read coverage log:', e.message);
          }
          if (!table) {
            console.log('No coverage table found; skipping PR comment.');
            return;
          }
          const body = '## Backend Coverage\n```\n' + table + '\n```';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            (c) => c.body && c.body.startsWith('## Backend Coverage')
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
